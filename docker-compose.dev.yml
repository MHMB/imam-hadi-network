# Development-only Postgres. Production stack lives in docker-compose.prod.yml (P8).
# Exposes :5433 on localhost (not 5432) to avoid conflict with any local Postgres install.

name: imamhadi-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: imamhadi
      POSTGRES_USER: imamhadi
      POSTGRES_PASSWORD: imamhadi_dev_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imamhadi -d imamhadi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
